name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/ThisWidget -c Release
      - run: dotnet run --project tests/ThisWidget.Tests
      - run: dotnet run --project tests/ThisWidget.UiTests
      - run: ./scripts/Publish.ps1 -Runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ThisWidget-Windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
